naftiko: "1.0.0-alpha1"

info:
  label: "Telefonie SMS API"
  description: "Programmable SMS API for sending and receiving text messages globally with delivery tracking."
  tags:
    - Bulk SMS
    - Messaging
    - SMS
    - Text Messages
    - Two-Way Messaging
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TELEFONIE_API_KEY: TELEFONIE_API_KEY

capability:
  consumes:
    - type: http
      namespace: telefonie-sms
      baseUri: https://api.telefonie.com/v1/sms
      description: "Telefonie SMS API for sending and receiving text messages"
      authentication:
        type: apikey
        key: X-API-Key
        value: "{{TELEFONIE_API_KEY}}"
        placement: header
      resources:
        - name: messages
          path: /messages
          description: "SMS and MMS message management"
          operations:
            - name: list-messages
              method: GET
              description: "List sent and received messages"
              inputParameters:
                - name: direction
                  in: query
                  type: string
                  required: false
                  description: "inbound or outbound"
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by delivery status"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: send-message
              method: POST
              description: "Send an SMS or MMS message"
              inputParameters:
                - name: to
                  in: body
                  type: string
                  required: true
                  description: "Recipient phone number in E.164 format"
                - name: from
                  in: body
                  type: string
                  required: true
                  description: "Sender phone number"
                - name: body
                  in: body
                  type: string
                  required: false
                  description: "Text content of the message"
                - name: media_url
                  in: body
                  type: array
                  required: false
                  description: "URLs of media for MMS"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8111
      namespace: telefonie-sms-rest
      resources:
        - path: /v1/messages
          name: messages
          description: "SMS and MMS messages"
          operations:
            - method: GET
              name: list-messages
              description: "List messages"
              call: "telefonie-sms.list-messages"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: send-message
              description: "Send an SMS or MMS message"
              call: "telefonie-sms.send-message"
              with:
                to: "rest.to"
                from: "rest.from"
                body: "rest.body"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9111
      namespace: telefonie-sms-mcp
      transport: http
      tools:
        - name: list-messages
          description: "List SMS and MMS messages with optional direction and status filters"
          hints:
            readOnly: true
            openWorld: false
          call: "telefonie-sms.list-messages"
          outputParameters:
            - type: object
              mapping: "$."

        - name: send-sms
          description: "Send an SMS text message to a phone number"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "telefonie-sms.send-message"
          with:
            to: "tools.to"
            from: "tools.from"
            body: "tools.body"
          outputParameters:
            - type: object
              mapping: "$."
