naftiko: "1.0.0-alpha1"

info:
  label: "Telefonie Voice API"
  description: "Programmable voice API for making and receiving calls, managing conferences, and recording conversations."
  tags:
    - Calls
    - Conferencing
    - Telephony
    - Voice
    - VoIP
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TELEFONIE_API_KEY: TELEFONIE_API_KEY

capability:
  consumes:
    - type: http
      namespace: telefonie-voice
      baseUri: https://api.telefonie.com/v1/voice
      description: "Telefonie Voice API for call management and conferencing"
      authentication:
        type: apikey
        key: X-API-Key
        value: "{{TELEFONIE_API_KEY}}"
        placement: header
      resources:
        - name: calls
          path: /calls
          description: "Voice call management"
          operations:
            - name: list-calls
              method: GET
              description: "List calls with optional status and direction filters"
              inputParameters:
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by call status"
                - name: direction
                  in: query
                  type: string
                  required: false
                  description: "inbound or outbound"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: initiate-call
              method: POST
              description: "Initiate an outbound phone call"
              inputParameters:
                - name: to
                  in: body
                  type: string
                  required: true
                  description: "Destination phone number in E.164 format"
                - name: from
                  in: body
                  type: string
                  required: true
                  description: "Caller ID phone number"
                - name: url
                  in: body
                  type: string
                  required: false
                  description: "Webhook URL for call flow control"
                - name: record
                  in: body
                  type: boolean
                  required: false
                  description: "Whether to record the call"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: conferences
          path: /conferences
          description: "Multi-party conference management"
          operations:
            - name: list-conferences
              method: GET
              description: "List all conference calls"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-conference
              method: POST
              description: "Create a new conference room"
              inputParameters:
                - name: friendly_name
                  in: body
                  type: string
                  required: false
                  description: "Human-readable name for the conference"
                - name: record
                  in: body
                  type: boolean
                  required: false
                  description: "Auto-record the conference"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8110
      namespace: telefonie-voice-rest
      resources:
        - path: /v1/calls
          name: calls
          description: "Voice call management"
          operations:
            - method: GET
              name: list-calls
              description: "List voice calls"
              call: "telefonie-voice.list-calls"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: initiate-call
              description: "Initiate an outbound call"
              call: "telefonie-voice.initiate-call"
              with:
                to: "rest.to"
                from: "rest.from"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/conferences
          name: conferences
          description: "Conference management"
          operations:
            - method: GET
              name: list-conferences
              description: "List conferences"
              call: "telefonie-voice.list-conferences"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-conference
              description: "Create a new conference"
              call: "telefonie-voice.create-conference"
              with:
                friendly_name: "rest.friendly_name"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9110
      namespace: telefonie-voice-mcp
      transport: http
      tools:
        - name: list-calls
          description: "List voice calls with optional status and direction filters"
          hints:
            readOnly: true
            openWorld: false
          call: "telefonie-voice.list-calls"
          outputParameters:
            - type: object
              mapping: "$."

        - name: initiate-call
          description: "Initiate an outbound voice call to a phone number"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "telefonie-voice.initiate-call"
          with:
            to: "tools.to"
            from: "tools.from"
            url: "tools.url"
            record: "tools.record"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-conferences
          description: "List all active and past conference calls"
          hints:
            readOnly: true
            openWorld: false
          call: "telefonie-voice.list-conferences"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-conference
          description: "Create a new multi-party conference room"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "telefonie-voice.create-conference"
          with:
            friendly_name: "tools.friendly_name"
            record: "tools.record"
          outputParameters:
            - type: object
              mapping: "$."
