naftiko: 1.0.0-alpha2
info:
  label: Telefonie Communications
  description: Unified capability combining Telefonie Voice and SMS APIs for comprehensive communications workflows. Enables
    voice calling, SMS messaging, conferencing, and call recording from a single interface. Designed for developers building
    customer communication, notification, and engagement platforms.
  tags:
  - Call Recording
  - Communications
  - CPaaS
  - Messaging
  - SMS
  - Telephony
  - Voice
  - VoIP
  created: '2026-05-03'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    TELEFONIE_API_KEY: TELEFONIE_API_KEY
capability:
  consumes:
  - type: http
    namespace: telefonie-voice
    baseUri: https://api.telefonie.com/v1/voice
    description: Telefonie Voice API for call management and conferencing
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{TELEFONIE_API_KEY}}'
      placement: header
    resources:
    - name: calls
      path: /calls
      description: Voice call management
      operations:
      - name: list-calls
        method: GET
        description: List calls with optional status and direction filters
        inputParameters:
        - name: status
          in: query
          type: string
          required: false
          description: Filter by call status
        - name: direction
          in: query
          type: string
          required: false
          description: inbound or outbound
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: initiate-call
        method: POST
        description: Initiate an outbound phone call
        inputParameters:
        - name: to
          in: body
          type: string
          required: true
          description: Destination phone number in E.164 format
        - name: from
          in: body
          type: string
          required: true
          description: Caller ID phone number
        - name: url
          in: body
          type: string
          required: false
          description: Webhook URL for call flow control
        - name: record
          in: body
          type: boolean
          required: false
          description: Whether to record the call
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: conferences
      path: /conferences
      description: Multi-party conference management
      operations:
      - name: list-conferences
        method: GET
        description: List all conference calls
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-conference
        method: POST
        description: Create a new conference room
        inputParameters:
        - name: friendly_name
          in: body
          type: string
          required: false
          description: Human-readable name for the conference
        - name: record
          in: body
          type: boolean
          required: false
          description: Auto-record the conference
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: telefonie-sms
    baseUri: https://api.telefonie.com/v1/sms
    description: Telefonie SMS API for sending and receiving text messages
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{TELEFONIE_API_KEY}}'
      placement: header
    resources:
    - name: messages
      path: /messages
      description: SMS and MMS message management
      operations:
      - name: list-messages
        method: GET
        description: List sent and received messages
        inputParameters:
        - name: direction
          in: query
          type: string
          required: false
          description: inbound or outbound
        - name: status
          in: query
          type: string
          required: false
          description: Filter by delivery status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: send-message
        method: POST
        description: Send an SMS or MMS message
        inputParameters:
        - name: to
          in: body
          type: string
          required: true
          description: Recipient phone number in E.164 format
        - name: from
          in: body
          type: string
          required: true
          description: Sender phone number
        - name: body
          in: body
          type: string
          required: false
          description: Text content of the message
        - name: media_url
          in: body
          type: array
          required: false
          description: URLs of media for MMS
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: telefonie-communications-api
    description: Unified REST API for Telefonie voice and SMS communications.
    resources:
    - path: /v1/calls
      name: calls
      description: Voice call management
      operations:
      - method: GET
        name: list-calls
        description: List voice calls with filtering options
        call: telefonie-voice.list-calls
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: initiate-call
        description: Initiate an outbound voice call
        call: telefonie-voice.initiate-call
        with:
          to: rest.to
          from: rest.from
          url: rest.url
          record: rest.record
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/conferences
      name: conferences
      description: Multi-party conference management
      operations:
      - method: GET
        name: list-conferences
        description: List all conferences
        call: telefonie-voice.list-conferences
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-conference
        description: Create a new conference room
        call: telefonie-voice.create-conference
        with:
          friendly_name: rest.friendly_name
          record: rest.record
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/messages
      name: messages
      description: SMS and MMS messaging
      operations:
      - method: GET
        name: list-messages
        description: List SMS and MMS messages
        call: telefonie-sms.list-messages
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: send-message
        description: Send an SMS or MMS message
        call: telefonie-sms.send-message
        with:
          to: rest.to
          from: rest.from
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: telefonie-communications-mcp
    transport: http
    description: MCP server for AI-assisted communications using Telefonie voice and SMS APIs.
    tools:
    - name: list-calls
      description: List voice calls with optional status and direction filtering
      hints:
        readOnly: true
        openWorld: false
      call: telefonie-voice.list-calls
      outputParameters:
      - type: object
        mapping: $.
    - name: make-call
      description: Initiate an outbound phone call to a specified number
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: telefonie-voice.initiate-call
      with:
        to: tools.to
        from: tools.from
        url: tools.url
        record: tools.record
      outputParameters:
      - type: object
        mapping: $.
    - name: list-conferences
      description: List all active and completed conference calls
      hints:
        readOnly: true
        openWorld: false
      call: telefonie-voice.list-conferences
      outputParameters:
      - type: object
        mapping: $.
    - name: create-conference
      description: Create a new multi-party conference call room
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: telefonie-voice.create-conference
      with:
        friendly_name: tools.friendly_name
        record: tools.record
      outputParameters:
      - type: object
        mapping: $.
    - name: list-messages
      description: List sent and received SMS and MMS messages
      hints:
        readOnly: true
        openWorld: false
      call: telefonie-sms.list-messages
      outputParameters:
      - type: object
        mapping: $.
    - name: send-sms
      description: Send an SMS or MMS message to a phone number
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: telefonie-sms.send-message
      with:
        to: tools.to
        from: tools.from
        body: tools.body
        media_url: tools.media_url
      outputParameters:
      - type: object
        mapping: $.
